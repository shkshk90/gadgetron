services:
  gadgetron:
    build: 
      context: .
      network: host
      ulimits:
        nproc: 65535
        nofile:
          soft: 20000
          hard: 40000
    command: ["/bin/bash"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
